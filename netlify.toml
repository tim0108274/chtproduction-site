[build]
  publish = "."

[[headers]]
  for = "/medias/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://www.chtproduction.fr/*"
  to = "https://chtproduction.fr/:splat"
  status = 301
  force = true
